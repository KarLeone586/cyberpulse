<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberPulse Admin</title><link rel="icon" href="favicon.svg"><style>body{background:#090b10;color:#fff;font-family:Arial;padding:24px}main{max-width:850px;margin:auto}.card{background:#151a26;padding:22px;border-radius:16px;margin:16px 0}input,textarea,select{display:block;width:100%;padding:12px;margin:8px 0;background:#20283a;color:#fff;border:1px solid #445;border-radius:8px}button{padding:12px 18px;border:0;border-radius:20px;background:#6c63ff;color:#fff;margin:4px}.row{display:flex;gap:12px;align-items:center;border-top:1px solid #334;padding:12px 0}.row img{width:64px;height:64px;object-fit:cover;border-radius:8px}</style></head><body><main><h1>CyberPulse — товары</h1><p>Добавляйте товары и фотографии. Они сохраняются в браузере этого устройства.</p><section class="card"><h2>Новый товар</h2><input id="n" placeholder="Название"><input id="p" type="number" placeholder="Цена USD"><select id="c"><option>devices</option><option>modules</option><option>firmware</option><option>accessories</option></select><input id="f" type="file" accept="image/*"><textarea id="d" placeholder="Описание"></textarea><button id="add">Добавить</button><button onclick="location.href='index.html'">В каталог</button></section><section class="card"><h2>Мои товары</h2><div id="list"></div></section></main><script>let a=JSON.parse(localStorage.getItem('adminProducts')||'[]');let list=document.getElementById('list');function draw(){list.innerHTML=a.length?a.map((x,i)=>'<div class="row"><img src="'+x.img+'"><div>'+x.name+'<br>$'+x.price_usd+'<br><button onclick="del('+i+')">Удалить</button></div></div>').join(''):'<p>Товаров пока нет.</p>';localStorage.setItem('adminProducts',JSON.stringify(a))}function del(i){a.splice(i,1);draw()}document.getElementById('add').onclick=()=>{let file=document.getElementById('f').files[0];let save=img=>{a.push({id:Date.now(),name:document.getElementById('n').value,price_usd:Number(document.getElementById('p').value||0),category:document.getElementById('c').value,img:img||'favicon.svg',desc:document.getElementById('d').value,fullDesc:document.getElementById('d').value});draw()};if(file){let r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(file)}else save()};draw();</script></body></html>
