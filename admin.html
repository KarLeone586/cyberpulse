<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberPulse — админ-панель</title><style>body{margin:0;background:#090b10;color:#fff;font:16px Arial}main{max-width:1100px;margin:auto;padding:24px}.card{background:#151a26;padding:22px;border-radius:16px;margin:16px 0}input,textarea,button{padding:11px;margin:5px;border-radius:9px;border:1px solid #445;background:#20283a;color:#fff}input{width:240px}textarea{width:95%;min-height:80px}button{background:#6c63ff;border:0;cursor:pointer}.hidden{display:none}.row{display:flex;gap:14px;align-items:center;border-top:1px solid #334;padding:12px 0}.row img{width:70px;height:70px;object-fit:cover;border-radius:8px}.muted{color:#9ca8bb}.metrics{display:flex;gap:18px;flex-wrap:wrap}.metric{background:#20283a;padding:16px;border-radius:12px;min-width:130px}.metric b{font-size:24px;display:block;margin-top:5px}</style></head><body><main><h1>CyberPulse — профессиональная админ-панель</h1><section id="loginBox" class="card"><h2>Вход администратора</h2><input id="login" placeholder="Логин"><input id="password" type="password" placeholder="Пароль"><button onclick="signIn()">Войти</button><p id="error"></p></section><section id="panel" class="hidden"><div class="card"><h2>Аналитика</h2><div id="metrics" class="metrics"></div></div><div class="card"><h2 id="formTitle">Добавить товар</h2><input id="name" placeholder="Название"><input id="price" type="number" step="0.01" placeholder="Цена USD"><input id="discount" type="number" min="0" max="100" placeholder="Скидка %"><input id="category" placeholder="Категория"><input id="stock" type="number" placeholder="Остаток"><input id="image" placeholder="Ссылка на фото"><br><textarea id="description" placeholder="Описание"></textarea><br><button onclick="saveProduct()">Сохранить</button><button onclick="clearForm()">Очистить</button><div id="preview"></div></div><div class="card"><h2>Товары</h2><button onclick="loadAll()">Обновить</button><div id="products"></div></div><div class="card"><h2>Заказы и покупатели</h2><div id="orders"></div></div></section></main><script>const API='https://cyberpulse-api-production.up.railway.app';let token=sessionStorage.getItem('cp_token')||'',items=[],editing=null;const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function signIn(){const l=document.getElementById('login').value.trim(),p=document.getElementById('password').value;const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:l,password:p})});const d=await r.json();if(!r.ok){document.getElementById('error').textContent='Неверный логин или пароль';return}token=d.token;sessionStorage.setItem('cp_token',token);show()}function show(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAll()}function clearForm(){editing=null;document.getElementById('formTitle').textContent='Добавить товар';['name','price','discount','category','stock','image','description'].forEach(x=>document.getElementById(x).value='');document.getElementById('preview').innerHTML=''}function editP(id){const x=items.find(y=>y.id===id);if(!x)return;editing=id;document.getElementById('formTitle').textContent='Редактировать товар #'+id;document.getElementById('name').value=x.name||'';document.getElementById('price').value=x.price_usd||0;document.getElementById('discount').value=x.discount_percent||0;document.getElementById('category').value=x.category||'';document.getElementById('stock').value=x.stock||0;document.getElementById('image').value=x.image_url||'';document.getElementById('description').value=x.description||'';document.getElementById('preview').innerHTML=x.image_url?'<img src="'+x.image_url+'" style="max-width:180px">':'';window.scrollTo(0,0)}async function saveProduct(){const p={name:document.getElementById('name').value,price_usd:Number(document.getElementById('price').value||0),discount_percent:Number(document.getElementById('discount').value||0),category:document.getElementById('category').value||'devices',stock:Number(document.getElementById('stock').value||0),image_url:document.getElementById('image').value,description:document.getElementById('description').value};const r=await fetch(API+(editing?'/api/products/'+editing:'/api/products'),{method:editing?'PATCH':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(p)});if(r.ok){clearForm();loadAll()}else alert('Ошибка сохранения')}async function loadAll(){const h={Authorization:'Bearer '+token};const p=await(await fetch(API+'/api/products')).json();items=p.products||[];document.getElementById('products').innerHTML=items.map(x=>'<div class="row"><img src="'+x.image_url+'"><div style="flex:1"><b>'+esc(x.name)+'</b><br>$'+x.price_usd+' · скидка '+(x.discount_percent||0)+'% · остаток '+x.stock+'<br>'+esc(x.description)+'</div><button data-edit-id="'+x.id+'">Изменить</button></div>').join('')||'<p class="muted">Товаров пока нет.</p>';;document.querySelectorAll('#products [data-edit-id]').forEach(b=>b.addEventListener('click',()=>editP(Number(b.dataset.editId))))const o=await(await fetch(API+'/api/orders',{headers:h})).json();document.getElementById('orders').innerHTML=(o.orders||[]).map(x=>'<div class="row"><div><b>Заказ #'+x.id+'</b> · '+esc(x.customer_name)+' · '+esc(x.customer_email)+' · $'+x.total_usd+'</div></div>').join('')||'<p class="muted">Заказов пока нет.</p>';const a=await(await fetch(API+'/api/analytics',{headers:h})).json();const z=a.analytics||{};document.getElementById('metrics').innerHTML='<div class="metric">Товаров<b>'+z.products+'</b></div><div class="metric">Заказов<b>'+z.orders+'</b></div><div class="metric">Выручка<b>$'+z.revenue+'</b></div><div class="metric">За 30 дней<b>'+z.recent_orders+'</b></div>'}window.signIn=signIn;window.show=show;window.clearForm=clearForm;window.editP=editP;window.saveProduct=saveProduct;window.loadAll=loadAll;if(token)show();document.addEventListener('click',e=>{const b=e.target.closest('[data-edit-id]');if(b)editP(Number(b.dataset.editId))});;(()=>{const by=t=>[...document.querySelectorAll('button')].find(b=>b.textContent.trim()===t);by('Войти')?.addEventListener('click',signIn);by('Сохранить')?.addEventListener('click',saveProduct);by('Очистить')?.addEventListener('click',clearForm);by('Обновить')?.addEventListener('click',loadAll)})();</script></body></html>
