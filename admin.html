<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberPulse — админ-панель</title><link rel="icon" href="favicon.svg"><style>body{margin:0;background:#090b10;color:#fff;font:16px Arial}main{max-width:1000px;margin:auto;padding:24px}.card{background:#151a26;padding:22px;border-radius:16px;margin:16px 0}input,select,button{padding:12px;margin:5px;border-radius:9px;border:1px solid #445;background:#20283a;color:#fff}button{background:#6c63ff;border:0;cursor:pointer}.hidden{display:none}.row{display:flex;gap:16px;align-items:center;border-top:1px solid #334;padding:12px 0}.muted{color:#9ca8bb}</style></head><body><main><h1>CyberPulse — админ-панель</h1><section id="loginBox" class="card"><h2>Вход администратора</h2><input id="login" placeholder="Логин"><input id="password" type="password" placeholder="Пароль"><button onclick="signIn()">Войти</button><p id="error"></p></section><section id="panel" class="hidden"><div class="card"><h2>Товары</h2><button onclick="loadAll()">Обновить</button><div id="products"></div></div><div class="card"><h2>Заказы и покупатели</h2><div id="orders"></div></div></section></main><script>const API='https://cyberpulse-api-production.up.railway.app';let token=sessionStorage.getItem('cp_token')||'';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function signIn(){const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok){document.getElementById('error').textContent='Неверный логин или пароль';return}token=d.token;sessionStorage.setItem('cp_token',token);show()}function show(){document.getElementById('login').parentElement.classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAll()}async function loadAll(){const h={Authorization:'Bearer '+token};const p=await (await fetch(API+'/api/products')).json();document.getElementById('products').innerHTML=(p.products||[]).map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b><br>$'+esc(x.price_usd)+' · '+esc(x.category)+' · остаток '+esc(x.stock)+'</div></div>').join('')||'<p class="muted">Товаров пока нет.</p>';const o=await (await fetch(API+'/api/orders',{headers:h})).json();document.getElementById('orders').innerHTML=(o.orders||[]).map(x=>'<div class="row"><div><b>Заказ #'+esc(x.id)+'</b><br>'+esc(x.customer_name)+' · '+esc(x.customer_email)+' · $'+esc(x.total_usd)+'</div><select onchange="status('+x.id+',this.value)"><option value="new">Новый</option><option value="confirmed">Подтверждён</option><option value="awaiting_payment">Ожидает оплату</option><option value="paid">Оплачен</option><option value="shipped">Отправлен</option><option value="completed">Завершён</option><option value="cancelled">Отменён</option></select></div>').join('')||'<p class="muted">Заказов пока нет.</p>'}async function status(id,value){await fetch(API+'/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status:value})});}if(token)show();</script></body></html>
