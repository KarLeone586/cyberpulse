<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberPulse — админ-панель</title><style>
:root{color-scheme:dark}body{margin:0;background:#090b10;color:#f5f7fb;font:15px Arial,sans-serif}main{max-width:1180px;margin:auto;padding:24px}.card{background:#151a26;border:1px solid #283249;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 12px 30px #0003}h1{margin:0 0 20px}h2{margin-top:0}input,textarea,button{box-sizing:border-box;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #445;background:#20283a;color:#fff;font:inherit}input{width:100%}textarea{width:100%;min-height:100px;resize:vertical}button{background:#6c63ff;border:0;cursor:pointer;padding:11px 16px}button.secondary{background:#303b52}button:hover{filter:brightness(1.15)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:14px;align-items:center;border-top:1px solid #334;padding:13px 0}.row img{width:72px;height:72px;object-fit:cover;border-radius:9px;background:#0e1320}.grow{flex:1}.muted{color:#9ca8bb}.metrics{display:flex;gap:14px;flex-wrap:wrap}.metric{background:#20283a;padding:15px;border-radius:12px;min-width:130px}.metric b{font-size:24px;display:block;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:#ff8a8a;min-height:20px}.success{color:#80e0a0;min-height:20px}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}.row{align-items:flex-start}.row img{width:56px;height:56px}}
</style></head><body><main><h1>CyberPulse — профессиональная админ-панель</h1>
<section id="loginBox" class="card"><h2>Вход администратора</h2><form id="loginForm"><div class="grid"><input id="login" autocomplete="username" placeholder="Логин" required><input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required></div><button type="submit">Войти</button><div id="loginError" class="error"></div></form></section>
<section id="panel" class="hidden"><div class="card"><h2>Аналитика</h2><div id="metrics" class="metrics"></div></div>
<div class="card"><h2 id="formTitle">Добавить товар</h2><form id="productForm"><div class="grid"><input id="name" placeholder="Название" required><input id="price" type="number" step="0.01" min="0" placeholder="Цена USD" required><input id="discount" type="number" min="0" max="100" placeholder="Скидка %"><input id="category" placeholder="Категория"><input id="stock" type="number" min="0" placeholder="Остаток"><input id="image" placeholder="Ссылка на фото"></div><textarea id="description" placeholder="Описание"></textarea><div class="actions"><button type="submit">Сохранить</button><button type="button" id="clearBtn" class="secondary">Очистить</button></div><div id="formMessage" class="success"></div></form></div>
<div class="card"><div class="actions"><h2 style="margin:0;flex:1">Товары</h2><button type="button" id="refreshBtn" class="secondary">Обновить</button></div><div id="products"></div></div>
<div class="card"><h2>Заказы и покупатели</h2><div id="orders"></div></div></section></main>
<script>
(function(){
'use strict';
const API='https://cyberpulse-api-production.up.railway.app';
let token=sessionStorage.getItem('cp_token')||'',items=[],editing=null;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setMessage(id,msg,cls){const el=$(id);el.textContent=msg;el.className=cls||''}
async function login(e){e.preventDefault();setMessage('loginError','');
try{const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('login').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok||!d.token)throw Error('Неверный логин или пароль');token=d.token;sessionStorage.setItem('cp_token',token);show()}catch(err){setMessage('loginError',err.message,'error')}}
function show(){$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');loadAll()}
function clearForm(){editing=null;$('formTitle').textContent='Добавить товар';['name','price','discount','category','stock','image','description'].forEach(id=>$(id).value='');setMessage('formMessage','')}
function fillProduct(id){const x=items.find(y=>Number(y.id)===Number(id));if(!x)return;editing=x.id;$('formTitle').textContent='Редактировать товар #'+x.id;$('name').value=x.name||'';$('price').value=x.price_usd??0;$('discount').value=x.discount_percent??0;$('category').value=x.category||'';$('stock').value=x.stock??0;$('image').value=x.image_url||'';$('description').value=x.description||'';window.scrollTo({top:0,behavior:'smooth'})}
async function save(e){e.preventDefault();setMessage('formMessage','Сохраняю...');const p={name:$('name').value.trim(),price_usd:Number($('price').value||0),discount_percent:Number($('discount').value||0),category:$('category').value.trim()||'devices',stock:Number($('stock').value||0),image_url:$('image').value.trim(),description:$('description').value.trim()};try{const r=await fetch(API+(editing?'/api/products/'+editing:'/api/products'),{method:editing?'PATCH':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(p)});if(!r.ok)throw Error('Сервер отклонил сохранение');clearForm();setMessage('formMessage','Изменения сохранены','success');await loadAll()}catch(err){setMessage('formMessage',err.message,'error')}}
async function loadAll(){try{const p=await(await fetch(API+'/api/products')).json();items=p.products||[];$('products').innerHTML=items.map(x=>'<div class="row"><img src="'+esc(x.image_url)+'"><div class="grow"><b>'+esc(x.name)+'</b><br>$'+Number(x.price_usd||0).toFixed(2)+' · скидка '+Number(x.discount_percent||0)+'% · остаток '+Number(x.stock||0)+'<br><span class="muted">'+esc(x.description)+'</span></div><button type="button" class="editBtn" data-id="'+x.id+'">Изменить</button></div>').join('')||'<p class="muted">Товаров пока нет.</p>';const h={Authorization:'Bearer '+token};const o=await(await fetch(API+'/api/orders',{headers:h})).json();$('orders').innerHTML=(o.orders||[]).map(x=>'<div class="row"><div><b>Заказ #'+x.id+'</b> · '+esc(x.customer_name)+' · '+esc(x.customer_email)+' · $'+x.total_usd+'</div></div>').join('')||'<p class="muted">Заказов пока нет.</p>';const a=await(await fetch(API+'/api/analytics',{headers:h})).json();const z=a.analytics||{};$('metrics').innerHTML='<div class="metric">Товаров<b>'+Number(z.products||0)+'</b></div><div class="metric">Заказов<b>'+Number(z.orders||0)+'</b></div><div class="metric">Выручка<b>$'+Number(z.revenue||0).toFixed(2)+'</b></div><div class="metric">За 30 дней<b>'+Number(z.recent_orders||0)+'</b></div>'}catch(err){setMessage('formMessage','Не удалось загрузить данные: '+err.message,'error')}}
document.addEventListener('DOMContentLoaded',()=>{ $('loginForm').addEventListener('submit',login);$('productForm').addEventListener('submit',save);$('clearBtn').addEventListener('click',clearForm);$('refreshBtn').addEventListener('click',loadAll);$('products').addEventListener('click',e=>{const b=e.target.closest('.editBtn');if(b)fillProduct(b.dataset.id)});if(token)show()});
})();
</script></body></html>
