<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPulse — товар</title><meta name="description" content="Подробные характеристики товара CyberPulse и оформление заказа через администратора."><link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0A0A0F; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #FFFFFF; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo h1 { font-size: 26px; background: linear-gradient(135deg, #FFFFFF, #6C63FF); -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; }
        .cart-icon { position: relative; cursor: pointer; display: flex; align-items: center; gap: 8px; background: rgba(108, 99, 255, 0.2); padding: 8px 18px; border-radius: 40px; }
        .cart-count { background: #FF4D4D; border-radius: 20px; padding: 2px 8px; font-size: 12px; }
        
        .back-link { color: #6C63FF; text-decoration: none; display: inline-block; margin: 20px 0; cursor: pointer; }
        
        .product-container { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin: 40px 0 60px; }
        @media (max-width: 800px) { .product-container { grid-template-columns: 1fr; gap: 24px; } }
        
        .gallery { background: rgba(255,255,255,0.03); border-radius: 24px; padding: 20px; }
        .main-image { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 0; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
        .main-image img { width: 100%; height: min(58vw, 520px); object-fit: cover; object-position: center; border-radius: 20px; display: block; }
        .main-image .fallback { font-size: 120px; }
        
        .product-info h1 { font-size: 32px; margin-bottom: 16px; }
        .product-price { font-size: 32px; font-weight: 700; color: #6C63FF; margin: 20px 0; }
        .old-price { font-size: 18px; color: rgba(255,255,255,0.4); text-decoration: line-through; margin-left: 12px; }
        
        .product-full-desc { color: rgba(255,255,255,0.7); line-height: 1.6; margin: 20px 0; font-size: 15px; }
        
        .specs { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 20px; margin: 20px 0; }
        .specs h3 { margin-bottom: 16px; font-size: 18px; }
        .specs ul { list-style: none; padding-left: 0; }
        .specs li { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); font-size: 14px; }
        .specs li:before { content: "✓"; color: #6C63FF; margin-right: 10px; font-weight: bold; }
        .specs li:last-child { border-bottom: none; }
        
        .btn-add-cart { width: 100%; background: linear-gradient(135deg, #6C63FF, #4A42D0); border: none; padding: 18px; border-radius: 40px; color: white; font-weight: 600; font-size: 18px; cursor: pointer; margin-top: 20px; transition: all 0.3s; }
        .btn-add-cart:hover { transform: scale(1.02); }
        
        .toast { position: fixed; bottom: 30px; right: 30px; left: 30px; max-width: 400px; margin-left: auto; background: #111118; border-left: 4px solid #6C63FF; padding: 12px 20px; border-radius: 12px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        
        .not-found { text-align: center; padding: 100px 20px; }
        .not-found h2 { font-size: 28px; margin-bottom: 16px; }
        .not-found a { color: #6C63FF; text-decoration: none; font-size: 16px; }
        
        @media (max-width: 768px) {
            .product-info h1 { font-size: 24px; }
            .product-price { font-size: 26px; }
            .main-image { min-height: 0; padding: 0; }
            .main-image img { height: 78vw; max-height: 420px; border-radius: 20px; }
            .main-image .fallback { font-size: 80px; }
        }
    .related{background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.25);border-radius:16px;padding:18px;margin-top:20px}.related h3{margin-bottom:8px}.related-note{color:rgba(255,255,255,.62);font-size:13px;margin-bottom:12px}.related-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.related-item{display:flex;flex-direction:column;gap:7px;padding:13px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(0,0,0,.18)}.related-item strong{font-size:14px}.related-item small{color:rgba(255,255,255,.62);line-height:1.4;flex:1}.related-item button{border:0;border-radius:9px;background:#6c63ff;color:#fff;padding:9px;cursor:pointer;font-weight:600}.related-type{font-size:11px;color:#a9a2ff;text-transform:uppercase;letter-spacing:.08em}.buy-now{background:linear-gradient(135deg,#2f9e72,#19734f)!important;margin-top:10px}</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="location.href='index.html'">
            <h1>CyberPulse</h1>
        </div>
        <div class="cart-icon" id="cartIcon">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </div>
    </div>

    <div class="back-link" onclick="location.href='index.html'">← Вернуться в каталог</div>

    <div id="productContainer"></div><section id="reviewsSection" style="margin:20px 0 60px;background:rgba(255,255,255,.03);border-radius:20px;padding:24px"><h2>Отзывы и рейтинг</h2><div id="reviewsList" style="margin:16px 0"></div><form id="reviewForm"><input id="reviewName" required placeholder="Ваше имя" style="padding:12px;border-radius:10px;background:#151522;color:#fff;border:1px solid #333;margin:4px"><select id="reviewRating" style="padding:12px;border-radius:10px;background:#151522;color:#fff;border:1px solid #333;margin:4px"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select><textarea id="reviewText" required placeholder="Ваш отзыв" style="width:100%;min-height:80px;padding:12px;border-radius:10px;background:#151522;color:#fff;border:1px solid #333;margin:4px"></textarea><button class="btn-add-cart" type="submit">Оставить отзыв</button></form></section>
</div>

<script>
    let product = null;
    let cart = [];
    try { const parsed = JSON.parse(localStorage.getItem('cart') || '[]'); cart = Array.isArray(parsed) ? parsed : []; } catch (_) { cart = []; }
    let currentCurrency = 'USD';
    let rubRate = 92;

    function loadProduct() {
        const saved = localStorage.getItem('currentProduct');
        if (saved && saved !== 'undefined' && saved !== 'null') {
            try { product = JSON.parse(saved); } catch(e) { console.error(e); }
        }
    }

    async function fetchRubRate() {
        try {
            const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await res.json();
            rubRate = data.rates.RUB;
        } catch(e) { rubRate = 92; }
        renderProduct();
    }

    function getPrice(priceUSD, priceUSDMax = null) {
        if(currentCurrency === 'USD') return { val: priceUSD, valMax: priceUSDMax, sym: '$' };
        return { val: Math.round(priceUSD * rubRate), valMax: priceUSDMax ? Math.round(priceUSDMax * rubRate) : null, sym: '₽' };
    }

    function formatPrice(price) {
        if (price.valMax) return `от ${price.val} до ${price.valMax} ${price.sym}`;
        return `${price.val} ${price.sym}`;
    }

    function updateCartCount() {
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').innerText = count;
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    window.buyNow = function(id) { addToCart(id); localStorage.setItem('checkoutCart', JSON.stringify(cart)); localStorage.setItem('checkoutProducts', JSON.stringify([product])); window.location.href='checkout.html'; };

    window.addToCart = function(id) {
        const existing = cart.find(item => item.id === id);
        if(existing) existing.quantity++;
        else cart.push({ id: id, quantity: 1 });
        updateCartCount();
        showToast("✓ Добавлено в корзину", "#4ADE80");
    };

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.textContent = String(msg);
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function escapeHtml(text) {
        if(!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderProduct() {
        const container = document.getElementById('productContainer');
        
        if(!product) {
            container.innerHTML = `
                <div class="not-found">
                    <h2>❌ Товар не найден</h2>
                    <p>Вернитесь в каталог и выберите товар заново</p><br>
                    <a href="index.html">← Вернуться в каталог</a>
                </div>
            `;
            return;
        }

        const hasSale = (product.salePrice && product.salePrice < product.price_usd) || (product.salePriceMax && product.salePriceMax < product.price_usd_max);
        const finalPriceMin = hasSale ? (product.salePrice || product.price_usd) : product.price_usd;
        const finalPriceMax = hasSale ? (product.salePriceMax || product.price_usd_max) : (product.price_usd_max || null);
        const price = getPrice(finalPriceMin, finalPriceMax);
        const oldPrice = hasSale ? getPrice(product.price_usd, product.price_usd_max) : null;
        
        const isImage = product.img && (product.img.endsWith('.png') || product.img.endsWith('.jpg') || product.img.endsWith('.jpeg') || product.img.endsWith('.webp') || product.img.startsWith('http'));
        const mainImageHtml = isImage 
            ? `<img src="${escapeHtml(product.img)}" alt="${escapeHtml(product.name)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'fallback\\'>📦</span>';">` 
            : `<span class="fallback">${product.img || '📦'}</span>`;
        
        const specs = (product.specs && product.specs.length) ? product.specs : ["Официальная гарантия", "Доставка по всему миру", "Поддержка 24/7"];

        container.innerHTML = `
            <div class="product-container">
                <div class="gallery">
                    <div class="main-image">${mainImageHtml}</div>
                </div>
                <div class="product-info">
                    <h1>${escapeHtml(product.name)}</h1>
                    <div class="product-price">
                        ${formatPrice(price)}
                        ${oldPrice ? `<span class="old-price">${formatPrice(oldPrice)}</span>` : ''}
                        ${hasSale ? `<span style="background:#FF4D4D; padding:2px 8px; border-radius:20px; font-size:14px; margin-left:12px;">🔥 Скидка</span>` : ''}
                    </div>
                    <div class="product-full-desc"><strong style="display:block;color:#fff;margin-bottom:8px;font-size:18px;">Описание</strong>${escapeHtml(product.fullDesc || product.desc || '')}</div>
                    <div class="specs">
                        <h3>📋 Характеристики</h3>
                        <ul>${specs.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
                    </div>
                    <button class="btn-add-cart" onclick="addToCart(${product.id})">🛒 Добавить в корзину</button><button class="btn-add-cart buy-now" onclick="buyNow(${product.id})">Купить сейчас</button>
                    <div id="relatedSection"></div>
                </div>
            </div>
        `;
        renderRelated();
    }

    const RELATED_CATALOG = [
        {name:'CC1101 модуль', price_usd:120, type:'Модуль', devices:['Flipper Zero'], desc:'Расширяет работу с Sub-GHz и радиочастотными экспериментами через GPIO.'},
        {name:'NRF24 для Flipper Zero', price_usd:150, type:'Модуль', devices:['Flipper Zero'], desc:'Модуль для лабораторных экспериментов с радиопротоколами 2.4 ГГц.'},
        {name:'SUB-GHZ PRO модуль', price_usd:130, type:'Модуль', devices:['Flipper Zero'], desc:'Дополнительный радиочастотный модуль для совместимых проектов Sub-GHz.'},
        {name:'BadUSB для Flipper Zero', price_usd:80, type:'Аксессуар', devices:['Flipper Zero'], desc:'Учебный USB-модуль для автоматизации собственных устройств и тестовых стендов.'},
        {name:'Кастомная прошивка для Flipper Zero', price_usd:50, type:'Прошивка', devices:['Flipper Zero'], desc:'Дополнительные функции и настройки для разрешённых лабораторных сценариев.'},
        {name:'ESP32 Marauder V6', price_usd:250, type:'Прошивка / модуль', devices:['ESP32'], desc:'Инструменты диагностики Wi‑Fi для собственного оборудования и учебной лаборатории.'},
        {name:'ESP32 Multi-Tool', price_usd:160, type:'Прошивка / модуль', devices:['ESP32'], desc:'Набор утилит для экспериментов с ESP32, GPIO и сетевыми протоколами.'},
        {name:'PortaPack firmware', price_usd:50, type:'Прошивка', devices:['HackRF One','HackRF One Portapack H2'], desc:'Программное расширение для автономной работы PortaPack и SDR-исследований.'},
        {name:'SDR++ / GNU Radio setup', price_usd:0, type:'ПО', devices:['HackRF One','HackRF One Portapack H2'], desc:'Программная связка для анализа спектра и работы с SDR-оборудованием.'},
        {name:'Raspberry Pi security image', price_usd:50, type:'Прошивка', devices:['Raspberry Pi 4 (8GB)','UConsole'], desc:'Образ Linux для учебных лабораторий, автоматизации и собственных IoT-проектов.'}
    ];
    function relatedFor(product){
        const name=String(product?.name||'').toLowerCase();
        let device=name.includes('flipper')?'Flipper Zero':name.includes('hackrf')||name.includes('portapack')?'HackRF One':name.includes('esp32')?'ESP32':name.includes('raspberry')||name.includes('uconsole')?'Raspberry Pi 4 (8GB)':null;
        return device?RELATED_CATALOG.filter(x=>x.devices.includes(device)&&!name.includes(x.name.toLowerCase().split(' ')[0])).slice(0,4):[];
    }
    function renderRelated(){
        const box=document.getElementById('relatedSection'); if(!box||!product)return;
        const items=relatedFor(product); if(!items.length){box.innerHTML='';return;}
        box.innerHTML='<div class="related"><h3>Совместимые модули и прошивки</h3><div class="related-note">Рекомендуемые дополнения для устройства «'+escapeHtml(product.name)+'».</div><div class="related-grid">'+items.map((x,i)=>'<div class="related-item"><span class="related-type">'+escapeHtml(x.type)+'</span><strong>'+escapeHtml(x.name)+'</strong><small>'+escapeHtml(x.desc)+'</small><button type="button" onclick="addRelated('+i+')">Добавить к заказу</button></div>').join('')+'</div></div>';
        window.__relatedItems=items;
    }
    window.addRelated=function(i){const x=(window.__relatedItems||[])[i];if(!x)return;const id=9000+i;const products=JSON.parse(localStorage.getItem('checkoutProducts')||'[]');if(!products.some(p=>Number(p.id)===id)){products.push({id,name:x.name,price_usd:Number(x.price_usd||0),img:'',desc:x.desc,fullDesc:x.desc});localStorage.setItem('checkoutProducts',JSON.stringify(products));}const cart=JSON.parse(localStorage.getItem('cart')||'[]');const found=cart.find(p=>p.id===id);if(found)found.quantity++;else cart.push({id,quantity:1});localStorage.setItem('cart',JSON.stringify(cart));showToast('Дополнение добавлено в корзину','#4ADE80');updateCartCount();};
    document.getElementById('cartIcon').onclick = () => { window.location.href = 'index.html'; };

    function renderReviews(){const list=document.getElementById("reviewsList");const all=JSON.parse(localStorage.getItem("reviews")||"[]").filter(r=>!product||r.productId===product.id);list.innerHTML=all.length?all.map(r=>"<div style=\"padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)\"><b>"+r.name+"</b> <span style=\"color:#ffd166\">"+"★".repeat(r.rating)+"</span><p style=\"color:rgba(255,255,255,.7)\">"+r.text+"</p></div>").join(""):"<p style=\"color:rgba(255,255,255,.5)\">Пока нет отзывов — будьте первым.</p>";} document.getElementById("reviewForm").addEventListener("submit",e=>{e.preventDefault();const all=JSON.parse(localStorage.getItem("reviews")||"[]");all.push({productId:product.id,name:reviewName.value,rating:Number(reviewRating.value),text:reviewText.value});localStorage.setItem("reviews",JSON.stringify(all));e.target.reset();renderReviews();}); loadProduct(); renderReviews();
    fetchRubRate();
    updateCartCount();
</script>
</body>
</html>
